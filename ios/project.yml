name: Dayplate
options:
  bundleIdPrefix: com.alexdils
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  Dayplate:
    type: application
    platform: iOS
    sources:
      - path: Dayplate
        excludes: [seed.json]
      - path: ../src
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexdils.dayplate
        DEVELOPMENT_TEAM: 3WKAG55LV4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Dayplate/Info.plist
      properties:
        CFBundleDisplayName: Dayplate
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
