<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Dayplate</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="polish.css"></head><body>
<div class="titlebar"></div><aside class="sidebar"><div class="brand"><span class="brand-icon">◒</span> dayplate<span class="brand-dot">.</span></div><nav><button class="nav active" data-view="journal" aria-label="Journal" title="Journal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h2m4 0h2m-8 3h2"/></svg></button><button class="nav" data-view="meals" aria-label="Meals" title="Meals"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M2 3v6m3-6v6M2 6h3M3.5 9v12M21 3v18m0-18c-3 2-3 8 0 8"/></svg><small id="meal-count"></small></button><button class="nav" data-view="analytics" aria-label="Analytics" title="Analytics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v18h17M8 16v-5m5 5V7m5 9V4"/></svg></button></nav></aside>
<main><header><div><h1 id="page-title"></h1></div><button class="primary" id="header-add" hidden>＋ Meal</button></header>
<section id="journal-view"><div class="date-row"><div class="date-control"><button id="prev-date" aria-label="Previous day">‹</button><input id="journal-date" type="date" aria-label="Journal date"><button id="next-date" aria-label="Next day">›</button></div><button class="text-button" id="today">Today</button><button class="calendar-button" id="open-calendar" aria-label="Calendar" title="Calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 11h16m-12 4h2m4 0h2"/></svg></button><span class="date-note" id="date-note"></span></div>
<div class="summary"><div class="calorie-summary"><div class="section-label">Calories</div><div class="calorie-ring-wrap"><svg class="calorie-ring nutrition-ring" viewBox="0 0 180 180" role="img" aria-label="Calories toward daily target"><circle class="calorie-ring-track" cx="90" cy="90" r="76"/><circle id="calorie-ring-fill" class="nutrition-ring-fill" cx="90" cy="90" r="76" pathLength="1"/></svg><div class="calorie-ring-value"><span id="consumed">0</span><small>kcal</small></div></div><div class="calorie-target" title="Daily calorie target"><span aria-hidden="true">◎</span><span id="goal-label">3,000</span><button class="icon-button" id="edit-goal" aria-label="Edit goal">✎</button></div><div id="remaining" class="calorie-delta"></div><div class="progress" hidden><div id="progress-fill"></div></div></div><div class="summary-aside nutrition-summary"><div class="protein-summary"><span class="section-label">Protein</span><div class="calorie-ring-wrap protein-ring-wrap"><svg class="calorie-ring protein-ring nutrition-ring" viewBox="0 0 180 180" role="img" aria-label="Protein toward daily target"><circle class="calorie-ring-track" cx="90" cy="90" r="76"/><circle id="protein-ring-fill" class="nutrition-ring-fill" cx="90" cy="90" r="76" pathLength="1"/></svg><div class="calorie-ring-value"><span id="protein-total">0</span><small>g <span id="protein-note"></span></small></div></div><div class="calorie-target" title="Daily protein target"><span aria-hidden="true">◎</span><span id="protein-goal">150</span><span>g</span></div><small id="protein-remaining" hidden></small></div></div><span id="logged-count" hidden></span></div><div class="daily-details"><div><span class="section-label">Carbs</span><strong id="carbs-total">—</strong></div><div><span class="section-label">Fat</span><strong id="fat-total">—</strong></div><button id="weigh-in" class="daily-weight"><span class="section-label">Weight</span><strong id="weight-value">＋</strong></button><small id="macro-note" hidden></small></div><section id="mobile-journal"></section>
<div class="content-grid"><section><div class="section-heading"><h2>Today’s meals</h2><span id="entry-count"></span></div><div id="journal-list"></div></section><aside class="quick-panel"><div class="section-heading"><h2>Add food</h2></div><p class="muted"></p><div class="food-tabs" role="tablist" aria-label="Food type"><button role="tab" aria-selected="true" data-food-tab="meals">Meals</button><button role="tab" aria-selected="false" data-food-tab="foods">Ingredients</button></div><div id="quick-meals"></div><button class="wide-button" id="new-meal">＋ Meal</button></aside></div></section>
<section id="meals-view" hidden><div class="library-toolbar"><input type="search" id="meal-search" placeholder="Find a meal…" aria-label="Search meals"><span class="muted"></span></div><div id="meal-library"></div></section>
<section id="analytics-view" hidden></section>
</main>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" role="status"></div><script src="model.js"></script><script src="app.js"></script><script src="analytics.js"></script><script src="mobile.js"></script></body></html>
